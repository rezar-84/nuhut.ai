name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the benchmark and upgrade tests install older kit
          # commits (bench-baseline-v0, ecab81b) through git worktrees.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile install.py install_ui.py validate.py tests/smoke.py optional/runtime/sdlc.py optional/runtime/view.py tools/semver.py benchmarks/lib/scoring.py benchmarks/effort-modes/score.py benchmarks/kit-value/*.py
      - name: Validate kit
        run: python validate.py
      - name: Run installer smoke tests
        run: python tests/smoke.py
