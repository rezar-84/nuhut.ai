<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDLC status — {{PROJECT_NAME}}</title>
<!--
  Read-only status page for the Nuhut kit. Open it from the filesystem; there is no
  server and no dependency.

  It reads dashboard-state.js, which is generated from the real files — the charter, the
  backlog, the frontmatter of every project artifact, and .ai-sdlc/profile.json. This page
  is kit-managed and upgradeable; the state file is a project record and is regenerated.
  Refresh it by re-running the installer, or with /sdlc-doctor.

  It is read-only on purpose. A dashboard that could edit the charter would become a
  second source of truth, and every rule in this kit depends on there being one.
-->
<script src="dashboard-state.js"></script>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a18; --dim: #6b6b66; --line: #e4e4e0;
    --ok: #1f7a4d; --warn: #9a6400; --bad: #b3261e; --accent: #2f5fd0;
    --chip: #f1f1ee;
  }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a; --panel: #1e1e23; --ink: #e8e8e4; --dim: #9a9a94; --line: #33333a;
      --ok: #5cc98d; --warn: #e0a83c; --bad: #f2776b; --accent: #7fa4f5; --chip: #26262c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--dim); margin: 30px 0 10px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 4px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .num { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
  .lbl { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font-weight: 600; color: var(--dim); font-size: 12px;
       text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px;
       border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip);
          font-size: 12px; white-space: nowrap; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .b-ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .b-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .b-bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .banner { border: 1px solid var(--line); border-left: 3px solid var(--bad);
            background: var(--panel); border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
  .banner.warn { border-left-color: var(--warn); }
  .none { color: var(--dim); font-style: italic; padding: 14px; }
  footer { color: var(--dim); font-size: 12px; margin-top: 40px; border-top: 1px solid var(--line);
           padding-top: 14px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title">SDLC status</h1>
  <p class="sub" id="meta"></p>
  <div id="alerts"></div>
  <div class="grid" id="tiles"></div>
  <div id="body"></div>
  <footer id="foot"></footer>
</main>
<script>
(function () {
  var S = window.SDLC_STATE || null;
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function chip(text, kind) { return el("span", "chip" + (kind ? " " + kind : ""), text); }

  if (!S) {
    $("body").appendChild(el("div", "banner",
      "dashboard-state.js is missing or did not load. This page shows nothing rather " +
      "than guessing: re-run the installer, or /sdlc-doctor, to regenerate it."));
    return;
  }

  // ---- header -------------------------------------------------------------
  $("title").textContent = "SDLC status — " + (S.project || "this project");
  var bits = [];
  if (S.prefix) bits.push("prefix " + S.prefix);
  if (S.kit_version) bits.push("kit v" + S.kit_version);
  if (S.profile) bits.push(S.profile + " profile");
  if (S.effort_mode) bits.push(S.effort_mode + " effort");
  if (S.acquisition_profile) bits.push(S.acquisition_profile + " acquisition");
  if (S.dev_method === "Epic") bits.push("epic method");
  bits.push("state generated " + (S.generated || "unknown"));
  $("meta").textContent = bits.join(" · ");

  function daysSince(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
    var d = (Date.now() - Date.parse(iso + "T00:00:00Z")) / 86400000;
    return Math.floor(d);
  }

  // ---- alerts: the things that make this page or the kit untrustworthy ----
  var alerts = [];
  var age = daysSince(S.generated);
  var window_days = S.staleness_days || 90;
  if (age !== null && age > window_days) {
    alerts.push(["This page is " + age + " days old, past the charter's " + window_days +
      "-day staleness window. Everything below may be wrong. Regenerate it before " +
      "relying on it.", ""]);
  }
  if (!S.wired || !S.wired.length) {
    alerts.push(["Nothing in this repository points an agent at AGENTS.md. The kit is " +
      "installed and will never be read — and nothing about the repository looks wrong. " +
      "Add “Read and follow AGENTS.md in this directory.” to the file your tool " +
      "loads, or re-run with --harness.", ""]);
  }
  var blankCmds = (S.commands || []).filter(function (c) { return !c.command; });
  if (blankCmds.length) {
    alerts.push([blankCmds.length + " check stage" + (blankCmds.length === 1 ? "" : "s") +
      " have no command in the charter. A blank cell is Unknown, not “absent”: an " +
      "agent that guesses one produces confidently false “verified” claims.",
      "warn"]);
  }
  var undecided = (S.roles || []).filter(function (r) { return !r.active && !r.reason; });
  if (undecided.length) {
    alerts.push([undecided.length + " role" + (undecided.length === 1 ? "" : "s") +
      " are unticked with no reason given. That means nobody decided, not that the role " +
      "does not apply: " + undecided.map(function (r) { return r.name; }).join(", "),
      "warn"]);
  }
  alerts.forEach(function (a) {
    $("alerts").appendChild(el("div", "banner" + (a[1] ? " " + a[1] : ""), a[0]));
  });

  // ---- tiles --------------------------------------------------------------
  var items = S.items || [];
  var open = items.filter(function (i) {
    return ["Done", "Dropped", "Deferred"].indexOf(i.status) < 0;
  });
  var blocked = items.filter(function (i) {
    return i.status === "Blocked" || i.status === "Parked";
  });
  var stale = (S.artifacts || []).filter(function (a) {
    var d = daysSince(a.last_reviewed);
    return a.status === "stale" || d === null || d > window_days;
  });
  var activeRoles = (S.roles || []).filter(function (r) { return r.active; });

  [[open.length, "open work items"],
   [blocked.length, "blocked or parked"],
   [stale.length, "artifacts stale or undated"],
   [activeRoles.length + "/" + (S.roles || []).length, "roles active"],
   [(S.commands || []).length - blankCmds.length + "/" + (S.commands || []).length,
    "check stages with a command"]
  ].forEach(function (t) {
    var c = el("div", "card");
    c.appendChild(el("div", "num", t[0]));
    c.appendChild(el("div", "lbl", t[1]));
    $("tiles").appendChild(c);
  });

  // ---- table helper -------------------------------------------------------
  function section(title, head, rows, empty) {
    $("body").appendChild(el("h2", null, title));
    if (!rows.length) {
      var box = el("div", "wrap");
      box.appendChild(el("div", "none", empty));
      $("body").appendChild(box);
      return;
    }
    var wrap = el("div", "wrap"), t = el("table"), thead = el("thead"), tr = el("tr");
    head.forEach(function (h) { tr.appendChild(el("th", null, h)); });
    thead.appendChild(tr); t.appendChild(thead);
    var tb = el("tbody");
    rows.forEach(function (r) {
      var row = el("tr");
      r.forEach(function (cell) {
        var td = el("td");
        if (cell && cell.nodeType) td.appendChild(cell);
        else td.textContent = cell === null || cell === undefined || cell === "" ? "—" : cell;
        row.appendChild(td);
      });
      tb.appendChild(row);
    });
    t.appendChild(tb); wrap.appendChild(t); $("body").appendChild(wrap);
  }

  // ---- work items ---------------------------------------------------------
  var STATUS_KIND = {
    "Ready": "", "Blocked": "b-bad", "In progress": "b-ok", "In review": "b-warn",
    "Parked": "b-warn", "Done": "b-ok", "Deferred": "", "Dropped": ""
  };
  section("Work in flight", ["ID", "Task", "Tier", "Owner role", "Depends on", "Status"],
    open.map(function (i) {
      return [el("span", "mono", i.id), i.task, i.tier, i.owner, i.depends,
              chip(i.status || "?", STATUS_KIND[i.status] || "")];
    }),
    "No open items in the backlog. Either the work is done or the backlog is not being kept.");

  // ---- artifacts ----------------------------------------------------------
  section("Project artifacts", ["Artifact", "Status", "Owner", "Last reviewed", "Age"],
    (S.artifacts || []).map(function (a) {
      var d = daysSince(a.last_reviewed);
      var kind = d === null ? "b-bad" : (d > window_days ? "b-warn" : "b-ok");
      var label = d === null ? "no valid date" : d + " days";
      return [el("span", "mono", a.file),
              chip(a.status || "?", a.status === "stale" ? "b-warn" : ""),
              a.owner, a.last_reviewed, chip(label, kind)];
    }),
    "No project artifacts found.");

  // ---- roles --------------------------------------------------------------
  section("Roles", ["Role", "Active", "Reason if inactive"],
    (S.roles || []).map(function (r) {
      return [r.name,
              chip(r.active ? "yes" : "no", r.active ? "b-ok" : (r.reason ? "" : "b-warn")),
              r.active ? "" : (r.reason || "nobody decided")];
    }),
    "No roles table found in the charter.");

  // ---- commands -----------------------------------------------------------
  section("Check stages", ["Stage", "Command"],
    (S.commands || []).map(function (c) {
      return [el("span", "mono", c.stage),
              c.command ? el("span", "mono", c.command) : chip("blank — Unknown", "b-warn")];
    }),
    "No Commands table found in the charter.");

  // ---- budgets ------------------------------------------------------------
  if ((S.budgets || []).length) {
    section("Budgets", ["What", "Budget", "Measured how", "Baseline"],
      S.budgets.map(function (b) { return [b.what, b.budget, b.method, b.baseline]; }),
      "None set.");
  }

  // ---- footer -------------------------------------------------------------
  var f = $("foot");
  f.appendChild(el("div", null,
    "Read-only. The files are the source of truth — where this page and a file disagree, " +
    "the file is right and this page is the defect."));
  f.appendChild(el("div", null,
    "For the full picture (every item, its plan, reviews, worklog and commits, and live " +
    "updates) run: python3 .ai-sdlc/bin/sdlc.py view --serve"));
  if (S.wired && S.wired.length) {
    f.appendChild(el("div", null, "Agent instruction files pointing at AGENTS.md: " +
      S.wired.join(", ")));
  }
})();
</script>
</body>
</html>
