        if (BLOCKAGE_STATE.filter === "ready") {
          var col4 = el("div", { cls: "dep-col active" });
          col4.appendChild(el("div", { cls: "dep-col-hdr" }, [
            el("span", { text: "Ready to Start (0 Blockers)" }),
            el("span", { cls: "chip", text: String(fReady.length) })
          ]));
          col4.appendChild(el("p", { cls: "dep-col-desc", text: "Active tasks with no pending technical prerequisites." }));
          if (!fReady.length) {
            col4.appendChild(el("p", { cls: "muted", style: "font-size: 13px;", text: "No ready tasks matching filter." }));
          } else {
            fReady.forEach(function (id) {
              var it = ITEMS[id] || {};
              var card = el("div", { cls: "dep-card", on: { click: function () { openItemDrawer(id); } } });
              card.appendChild(el("div", { style: "display: flex; justify-content: space-between; align-items: center;" }, [
                el("span", null, [itemLink(id), " ", colChip(it.column)]),
                it.owner ? el("span", { cls: "chip", text: it.owner }) : null
              ]));
              card.appendChild(el("div", { style: "font-weight: 600; font-size: 13px; margin: 4px 0;", text: it.title || id }));
              makeInteractive(card, function () { openItemDrawer(id); }, "Inspect ready item " + id);
              col4.appendChild(card);
            });
          }
          flow.appendChild(col4);
        }

        contentContainer.appendChild(flow);

      } else if (BLOCKAGE_STATE.view === "matrix") {
        contentContainer.appendChild(h(2, "Critical Bottleneck Impact Matrix (" + fBlockers.length + ")"));
        if (!fBlockers.length) {
          contentContainer.appendChild(el("p", { cls: "muted", text: "No active bottlenecks matching filter." }));
        } else {
          var mGrid = el("div", { cls: "matrix-grid" });
          fBlockers.forEach(function (b) {
            var it = ITEMS[b.id] || {};
            var card = el("div", { cls: "dep-card is-blocker", on: { click: function () { openItemDrawer(b.id); } } });
            card.appendChild(el("div", { style: "display: flex; justify-content: space-between; align-items: center;" }, [
              el("span", null, [itemLink(b.id), " ", colChip(it.column)]),
              el("span", { cls: "chip", style: "background: var(--warnbg); color: var(--warn); font-weight: 700;", text: "BLAST RADIUS: " + b.count })
            ]));
            card.appendChild(el("div", { style: "font-weight: 600; font-size: 14px; margin: 6px 0;", text: it.title || b.id }));
            if (it.owner) card.appendChild(el("div", { cls: "muted", style: "font-size: 12px; margin-bottom: 6px;", text: "Assigned owner: " + it.owner }));
            card.appendChild(el("div", { cls: "muted", style: "font-size: 12px; margin-bottom: 4px;", text: "Downstream items blocked by this task:" }));
            var dList = el("div", { cls: "dep-chip-list" });
            (b.dependents || []).forEach(function (depId) {
              var depIt = ITEMS[depId];
              dList.appendChild(el("a", {
                cls: "dep-chip" + (depIt && depIt.column === "Done" ? " done" : " active"),
                href: "#/item/" + depId,
                on: { click: function (e) { e.stopPropagation(); openItemDrawer(depId); } }
              }, [
                el("strong", { text: depId }),
                depIt ? el("span", { cls: "muted", text: "· " + clip(depIt.title, 20) }) : null
              ]));
            });
            card.appendChild(dList);
            makeInteractive(card, function () { openItemDrawer(b.id); }, "Inspect bottleneck " + b.id);
            mGrid.appendChild(card);
          });
          contentContainer.appendChild(mGrid);
        }

      } else {
        contentContainer.appendChild(h(2, "Comprehensive Dependencies Table"));
        var allIds = [];
        var seen = {};

        if (BLOCKAGE_STATE.filter === "all" || BLOCKAGE_STATE.filter === "blockers") {
          fBlockers.forEach(function (b) { if (!seen[b.id]) { seen[b.id] = true; allIds.push(b.id); } });
        }
        if (BLOCKAGE_STATE.filter === "all" || BLOCKAGE_STATE.filter === "blocked") {
          fBlocked.forEach(function (b) { if (!seen[b.id]) { seen[b.id] = true; allIds.push(b.id); } });
        }
        if (BLOCKAGE_STATE.filter === "all" || BLOCKAGE_STATE.filter === "human") {
          fHuman.forEach(function (id) { if (!seen[id]) { seen[id] = true; allIds.push(id); } });
        }
        if (BLOCKAGE_STATE.filter === "ready") {
          fReady.forEach(function (id) { if (!seen[id]) { seen[id] = true; allIds.push(id); } });
        }

        if (!allIds.length) {
          contentContainer.appendChild(el("p", { cls: "muted", text: "No items match current filters." }));
        } else {
          var tt = el("table", null, [el("tr", null, ["Item", "State", "Tier", "Owner", "Role in Dependencies", "Prerequisites / Downstream", "Waiting on (Human)", "Since"].map(function (x) {
            return el("th", { text: x });
          }))]);
          allIds.forEach(function (id) {
            var it = ITEMS[id] || {}, x = it.extra || {};
            var blk = blockers.find(function (b) { return b.id === id; });
            var dep = blockedItems.find(function (b) { return b.id === id; });

  // ---------------------------------------------------------------- git
  var GIT_FILTER = { query: "", mode: "all", branch: "all", view: "graph" };

  var GRAPH_COLORS = [
    "#388bfd",
    "#a371f7",
    "#3fb950",
    "#d29922",
    "#f85149",
    "#1f6feb",
    "#db61a2",
    "#56d364"
  ];

  function authorColor(name) {
    var hash = 0;
    for (var i = 0; i < (name || "").length; i++) hash = (hash * 31 + name.charCodeAt(i)) & 0xffffff;
    return GRAPH_COLORS[Math.abs(hash) % GRAPH_COLORS.length];
  }

  function authorInitials(name) {
    if (!name) return "?";
    var parts = name.trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return name.slice(0, 2).toUpperCase();
  }

  function timeAgo(dateStr) {
    if (!dateStr) return "";
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    var now = new Date();
    var diffSec = Math.floor((now - d) / 1000);
    if (diffSec < 60) return "just now";
    var diffMin = Math.floor(diffSec / 60);
    if (diffMin < 60) return diffMin + "m ago";
    var diffHours = Math.floor(diffMin / 60);
    if (diffHours < 24) return diffHours + "h ago";
    var diffDays = Math.floor(diffHours / 24);
    if (diffDays === 1) return "yesterday";
    if (diffDays < 30) return diffDays + "d ago";
    return dateStr;
  }

  function openCommitDrawer(c) {
    setInspect({ kind: "commit", id: c.sha, c: c });
    var container = el("div", { style: "display: flex; flex-direction: column; height: 100%;" });
    var remoteWeb = (M.git && M.git.remote_url) ? M.git.remote_url : "";

    var hdrLinks = [
      el("strong", { style: "font-family: monospace; font-size: 15px;", text: c.sha }),
      el("button", {
        cls: "codeblock-copy",

        style: "font-size: 11px; padding: 2px 8px;",
        on: { click: function (e) {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(c.sha).then(function () {
              e.target.textContent = "Copied!";
              setTimeout(function () { e.target.textContent = "Copy SHA"; }, 1500);
            });
          }
        } }
      })

    if (commitUrl) {
      hdrLinks.push(el("a", {
        href: commitUrl,

    var hdr = el("div", { cls: "drawer-header" }, [
      el("div", { style: "display: flex; align-items: baseline; gap: 8px; min-width: 0;" }, hdrLinks),

    ]);
    container.appendChild(hdr);

    var body = el("div", { cls: "drawer-body" });
    body.appendChild(el("h2", {
      style: "margin-top: 0; font-size: 16px; text-transform: none; color: var(--text); font-weight: 600; line-height: 1.4;",
      text: c.subject || "(no commit subject)"
    }));

    if (c.refs && c.refs.length) {
      var refWrap = el("div", { style: "margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px;" });
      c.refs.forEach(function (r) {
        var isHead = /HEAD/.test(r);
        var isTag = /^tag:/.test(r);
        var cls = isHead ? "git-ref git-ref-head" : (isTag ? "git-ref git-ref-tag" : "git-ref git-ref-remote");
        refWrap.appendChild(el("span", { cls: cls, text: (isTag ? "tag: " : "") + r.replace(/^tag:\s*/, "") }));
      });

    var infoCard = el("div", {

          cls: "git-avatar",

          text: authorInitials(c.author || "")
        }),
        el("strong", { text: c.author || "Unknown author" }),
        el("span", { cls: "muted", text: "· " + (c.date ? timeAgo(c.date) + " (" + c.date + ")" : "") })
      ])
    ]);
    body.appendChild(infoCard);

    if (c.parents && c.parents.length) {

        parentRow.appendChild(pLink);

    if (c.items && c.items.length) {

        var itemCard = el("div", {
          style: "display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; margin-bottom: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; cursor: pointer;",
          on: { click: function () { openItemDrawer(id); } }

  function computeGitGraph(commits) {
    var lanes = [];
    var laneColors = [];
    var colorSeq = 0;
    var graphRows = [];

    commits.forEach(function (c) {
      var sha = c.sha;
      var parents = c.parents || [];

      var myLane = -1;
      for (var l = 0; l < lanes.length; l++) {
        if (lanes[l] === sha) { myLane = l; break; }
      }
      if (myLane === -1) {
        for (var l = 0; l < lanes.length; l++) {
          if (lanes[l] === null) { myLane = l; break; }
        }
        if (myLane === -1) myLane = lanes.length;
        lanes[myLane] = sha;
        laneColors[myLane] = GRAPH_COLORS[colorSeq++ % GRAPH_COLORS.length];
      }

      var myColor = laneColors[myLane];
      var lines = [];

      for (var l = 0; l < lanes.length; l++) {
        if (l !== myLane && lanes[l] !== null) {
          lines.push({ from: l, to: l, color: laneColors[l], type: "pass" });
        }
      }

      if (parents.length === 0) {
        lanes[myLane] = null;
      } else {
        var p0 = parents[0];
        var p0Lane = -1;
        for (var l = 0; l < lanes.length; l++) {
          if (l !== myLane && lanes[l] === p0) { p0Lane = l; break; }
        }
        if (p0Lane !== -1) {
          lines.push({ from: myLane, to: p0Lane, color: myColor, type: "merge" });
          lanes[myLane] = null;
        } else {
          lines.push({ from: myLane, to: myLane, color: myColor, type: "straight" });
          lanes[myLane] = p0;
        }

        for (var pi = 1; pi < parents.length; pi++) {
          var pN = parents[pi];
          var pNLane = -1;
          for (var l = 0; l < lanes.length; l++) {
            if (lanes[l] === pN) { pNLane = l; break; }
          }
          if (pNLane === -1) {
            for (var l = 0; l < lanes.length; l++) {
              if (lanes[l] === null) { pNLane = l; break; }
            }
            if (pNLane === -1) pNLane = lanes.length;
            lanes[pNLane] = pN;
            laneColors[pNLane] = GRAPH_COLORS[colorSeq++ % GRAPH_COLORS.length];
          }
          lines.push({ from: myLane, to: pNLane, color: laneColors[pNLane] || myColor, type: "fork" });
        }
      }

      while (lanes.length > 0 && lanes[lanes.length - 1] === null) {
        lanes.pop();
      }

      graphRows.push({
        commit: c,
        lane: myLane,
        color: myColor,
        isMerge: parents.length > 1,
        activeLanes: Math.max(myLane + 1, lanes.length, 1),
        lines: lines
      });
    });

    var maxLanes = 1;
    graphRows.forEach(function (r) { maxLanes = Math.max(maxLanes, r.activeLanes); });
    return { rows: graphRows, maxLanes: maxLanes };
  }

  function drawGraphCell(rowInfo, maxLanes) {
    var NS = "http://www.w3.org/2000/svg";
    var LANE_W = 16;
    var ROW_H = 32;
    var totalW = maxLanes * LANE_W + 12;

    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "git-graph-svg");
    svg.setAttribute("width", String(totalW));
    svg.setAttribute("height", String(ROW_H));

    function xOf(lane) { return lane * LANE_W + 8; }
    var myX = xOf(rowInfo.lane);
    var myY = ROW_H / 2;

    rowInfo.lines.forEach(function (ln) {
      var x1 = xOf(ln.from), x2 = xOf(ln.to);
      var p = document.createElementNS(NS, "path");
      var d;
      if (ln.type === "pass") {
        d = "M " + x1 + " 0 L " + x2 + " " + ROW_H;
      } else if (ln.type === "straight") {
        d = "M " + x1 + " " + myY + " L " + x2 + " " + ROW_H;
      } else {
        var cy1 = myY + 8, cy2 = ROW_H - 4;
        d = "M " + x1 + " " + myY + " C " + x1 + " " + cy1 + " " + x2 + " " + cy2 + " " + x2 + " " + ROW_H;
      }
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", ln.color);
      p.setAttribute("stroke-width", "2");
      p.setAttribute("stroke-linecap", "round");
      svg.appendChild(p);
    });

    var topPath = document.createElementNS(NS, "path");
    topPath.setAttribute("d", "M " + myX + " 0 L " + myX + " " + myY);
    topPath.setAttribute("fill", "none");
    topPath.setAttribute("stroke", rowInfo.color);
    topPath.setAttribute("stroke-width", "2");
    svg.appendChild(topPath);

    var isHead = (rowInfo.commit.refs || []).some(function (r) { return /HEAD/.test(r); });
    if (isHead) {
      var halo = document.createElementNS(NS, "circle");
      halo.setAttribute("cx", String(myX));
      halo.setAttribute("cy", String(myY));
      halo.setAttribute("r", "6.5");
      halo.setAttribute("fill", "none");
      halo.setAttribute("stroke", rowInfo.color);
      halo.setAttribute("stroke-width", "1.5");
      halo.setAttribute("stroke-dasharray", "2 2");
      svg.appendChild(halo);
    }

    var dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", String(myX));
    dot.setAttribute("cy", String(myY));
    dot.setAttribute("r", rowInfo.isMerge ? "4.5" : "3.5");
    dot.setAttribute("fill", rowInfo.isMerge ? "var(--panel)" : rowInfo.color);
    dot.setAttribute("stroke", rowInfo.color);
    dot.setAttribute("stroke-width", "2");
    svg.appendChild(dot);

    return svg;
  }

    var latestWl = (it.worklog || []).map(function (n) { return WL[n]; }).filter(Boolean)
      .sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); })[0];
    var notDone = latestWl && latestWl.sections ? (latestWl.sections["Not done"] || latestWl.sections["Not Done"] || "").trim() : "";
    if (col !== "Done" && notDone && !/^(-|none|n\/a|nothing)\.?$/i.test(notDone)) {
      var firstLine = notDone.split("\n").map(function (l) { return l.replace(/^[-*\s]+/, "").replace(/[*`_]+/g, ""); }).filter(Boolean)[0] || notDone;
      firstLine = firstSentence(firstLine);
      return {
        label: "Finish what the worklog left open: " + clip(firstLine, 110),
        cmd: "/sdlc-build " + id,
        desc: "Resume " + id + " in your coding agent; the worklog's Not done section is the list",
        why: "The latest worklog entry (" + (latestWl.date || "undated") + ") says Not done",
        runPayload: null,
        kind: "warn"
      };
    }
    var gaps = Object.keys(steps).filter(function (k) { return steps[k] === "missing"; });
    if (gaps.length) {
      return {
        label: plural(gaps.length, "lifecycle step") + " missing (" + gaps.join(", ") + ") — record " + (gaps.length === 1 ? "it" : "them") + " before closing " + id,
        why: "Its tier and status call for records that do not exist",
        cmd: "python3 .ai-sdlc/bin/sdlc.py doctor --strict",
        desc: "Strict doctor names each missing record and where it belongs",
        runPayload: { subcommand: "doctor", strict: true },
        kind: "warn"
      };
    }
    return {
      label: col === "Done" ? "Completed & verified — run strict doctor audit" : "Ready to close in backlog.md — run strict doctor check",
      why: "Every expected record exists and the worklog leaves nothing open",
      cmd: "python3 .ai-sdlc/bin/sdlc.py doctor --strict",
      desc: "Runs mechanical doctor checks across charter, backlog, worklog, and evidence records",
      runPayload: { subcommand: "doctor", strict: true },
      kind: "ok"
    };
  }

        document.createTextNode(", and uses 1-line "),
        el("code", { text: "sdlc.py log --write" }),
        document.createTextNode(" worklogs.")
      ]),
      el("div", { style: "margin: 4px 0;" }, [
        el("div", { style: "display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;" }, [
          el("span", { text: "Estimated Tier 1 Reading Context: ~" + (rt.tier1_tokens || 0) + " tokens (" + (rt.tier1_words || 0) + " words)" }),
          el("span", { cls: "muted", text: "Baseline: ~" + (rt.baseline_tier1_tokens || 0) + " tokens" })
        ]),
        el("div", { cls: "meter-bar" }, [
          el("div", {
            cls: "meter-fill",
            style: "width: " + Math.min(100, Math.max(12, Math.round(((rt.tier1_tokens || 1) / Math.max(1, rt.baseline_tier1_tokens || 1)) * 100))) + "%;"
          })
        ]),
        el("div", { style: "display: flex; gap: 10px; margin-top: 6px; font-size: 11px; color: var(--muted);" }, [
          el("span", { text: "Tier 3: ~" + (rt.tier3_tokens || 0) + " tok" }),
          el("span", { text: "·" }),
          el("span", { text: "Tier 2: ~" + (rt.tier2_tokens || 0) + " tok" }),
          el("span", { text: "·" }),
          el("span", { text: "Tier 1: ~" + (rt.tier1_tokens || 0) + " tok" })
        ])
      ]),
      el("div", { style: "display: flex; gap: 8px; align-items: center; margin-top: 4px;" }, [
        el("button", {
          cls: "cmd-btn " + (tsOn ? "" : "primary") + (tsPending ? " pending" : ""),
          "aria-pressed": tsOn ? "true" : "false",
          text: tsOn ? "Disable Token-Saving Mode (Restore Previous Settings)" : "Enable Token-Saving Mode",
          on: { click: function () {
            var targetState = !tsOn ? "on" : "off";
            kitApi("/api/config", { token_saving: targetState }, "python3 .ai-sdlc/bin/sdlc.py config --token-saving " + targetState, "Token-Saving Mode " + targetState);
          } }
        })
      ])
    ]);
    grid.appendChild(tokenCard);

    // Card 2: Kit Constraints & Second-Reviewer Policy
    function makeSegControl(options, currentVal, stagedVal, onPick) {
      var grp = el("div", { cls: "seg-group", role: "group" });
      options.forEach(function (opt) {
        var val = opt[0], label = opt[1];
        var isCurrent = String(currentVal).toLowerCase() === String(val).toLowerCase();
        var isPending = !LIVE && stagedVal !== undefined && String(stagedVal).toLowerCase() === String(val).toLowerCase();
        grp.appendChild(el("button", {
          cls: "seg-btn" + (isCurrent ? " active" : "") + (isPending ? " pending" : ""),
          "aria-pressed": isCurrent ? "true" : "false",
          text: label + (isPending ? " *" : ""),
          on: { click: function () { onPick(val); } }
        }));
      });
      return grp;
    }

    var cliTools = inst.cli_tools || {};
    var constraintsCard = el("div", { cls: "kit-card" }, [
      el("h2", null, [el("span", { text: "Kit Constraints & Reviewer Policy" }), el("span", { cls: "stamp", text: "CHARTER.MD + PROFILE.JSON" })]),
      el("div", { cls: "constraint-row" }, [
        el("div", { cls: "constraint-label" }, [
          el("strong", { text: "Default Effort Level" }),
          el("span", { text: "Breadth of reading, role selection, and test depth" })
        ]),
        makeSegControl([["Lean", "Lean"], ["Normal", "Normal"], ["Beast", "Beast"]], c.effort_mode || "Normal", STAGED_KIT.config.effort, function (v) {
          kitApi("/api/config", { effort: v }, "python3 .ai-sdlc/bin/sdlc.py config --effort " + v, "Effort=" + v);
        })
      ]),
      el("div", { cls: "constraint-row" }, [
        el("div", { cls: "constraint-label" }, [
          el("strong", { text: "Second Agent / Independent Review" }),
          el("span", { text: "Off by default; require cross-model review only when manually enabled" })
        ]),
        makeSegControl([["none", "Off (Default)"], ["Tier 1", "Tier 1 Only"], ["Tier 1 and 2", "Tier 1 & 2"]], c.independent_review || "none", STAGED_KIT.config.independent_review, function (v) {
          var cliVal = v === "none" ? "none" : (v === "Tier 1 and 2" ? "tier1-2" : "tier1");
          kitApi("/api/config", { independent_review: v }, "python3 .ai-sdlc/bin/sdlc.py config --independent-review " + cliVal, "Independent review=" + v);
        })
      ]),
      el("div", { cls: "constraint-row" }, [
        el("div", { cls: "constraint-label" }, [
          el("strong", { text: "Preferred Second Reviewer CLI" }),
          el("span", { text: "Default harness for `sdlc.py review` (ON = on PATH)" })
        ]),
        makeSegControl(["codex", "claude", "gemini"].map(function (k) {
          return [k, k + (cliTools[k] ? " [ON]" : " [OFF]")];
        }), c.preferred_reviewer || "codex", STAGED_KIT.config.preferred_reviewer, function (v) {
          kitApi("/api/config", { preferred_reviewer: v }, "python3 .ai-sdlc/bin/sdlc.py config --reviewer " + v, "Reviewer=" + v);
        })
      ]),
      el("div", { cls: "constraint-row" }, [
        el("div", { cls: "constraint-label" }, [
          el("strong", { text: "Decision Style" }),
          el("span", { text: "Ask every choice · Guide with recommendation · Autopilot" })
        ]),
        makeSegControl([["Ask", "Ask"], ["Guide", "Guide"], ["Autopilot", "Autopilot"]], c.decision_style || "Guide", STAGED_KIT.config.decision_style, function (v) {
          kitApi("/api/config", { decision_style: v }, "python3 .ai-sdlc/bin/sdlc.py config --decision-style " + v, "Decision style=" + v);
        })
      ]),
      el("div", { cls: "constraint-row" }, [
        el("div", { cls: "constraint-label" }, [
          el("strong", { text: "Tier Rules & Development Method" }),
          el("span", { text: "Standard (blast radius) vs Strict · Item vs Epic" })
        ]),
        el("div", { style: "display: flex; gap: 6px; flex-wrap: wrap;" }, [
          makeSegControl([["Standard", "Standard"], ["Strict", "Strict"]], c.tier_rules || "Standard", STAGED_KIT.config.tier_rules, function (v) {
            kitApi("/api/config", { tier_rules: v }, "python3 .ai-sdlc/bin/sdlc.py config --tier-rules " + v, "Tier rules=" + v);
          }),
          makeSegControl([["Item", "Item"], ["Epic", "Epic"]], c.dev_method || "Item", STAGED_KIT.config.dev_method, function (v) {
            kitApi("/api/config", { dev_method: v }, "python3 .ai-sdlc/bin/sdlc.py config --dev-method " + v, "Dev method=" + v);
          })
        ])
      ])
    ]);
    grid.appendChild(constraintsCard);

    // Card 3: Fix Kit & Broken Setup ("Safe Auto-Repair")
    var hasCriticalFix = fixable.some(function (f) { return f.level === "fail"; });
    var repairCard = el("div", { cls: "kit-card" + (hasCriticalFix ? " alert-hero" : "") }, [
      el("h2", null, [
        el("span", { text: "Fix Kit & Broken Setup" }),
        el("button", {
          cls: "cmd-btn primary",
          text: "Fix Safe Setup Issues",
          on: { click: function () {
            kitApi("/api/fix", { action: "all" }, "python3 .ai-sdlc/bin/sdlc.py fix all", "Ran safe kit repairs");
          } }
        })
      ]),
      el("div", { cls: "muted", style: "font-size: 12px;", text: "Mechanical repairs sync profile.json drift, wire missing AGENTS.md pointers, restore interrupted bite runs, and unlock tests without fabricating charter decisions." })
    ]);

    var repairActions = [
      { id: "sync-profile", label: "Sync .ai-sdlc/profile.json with charter.md", cmd: "python3 .ai-sdlc/bin/sdlc.py fix sync-profile" },
      { id: "wire-pointer", label: "Wire CLAUDE.md pointer to AGENTS.md", cmd: "python3 .ai-sdlc/bin/sdlc.py fix wire-pointer" },
      { id: "restore-bite", label: "Restore interrupted `sdlc.py bite` backup", cmd: "python3 .ai-sdlc/bin/sdlc.py fix restore-bite" },
      { id: "unlock-tests", label: "Unlock reproducing tests in .ai-sdlc/test-lock.txt", cmd: "python3 .ai-sdlc/bin/sdlc.py fix unlock-tests" }
    ];
    repairActions.forEach(function (ra) {
      var activeIssue = fixable.filter(function (f) { return f.id === ra.id; })[0];
      repairCard.appendChild(el("div", { cls: "constraint-row" }, [
        el("div", { cls: "constraint-label" }, [
          el("strong", { text: ra.label }),
          el("span", {
            style: activeIssue ? "color: var(--bad); font-weight: 600;" : "",
            text: activeIssue ? ("NEEDED: " + activeIssue.detail) : "OK · Healthy"
          })
        ]),
        el("button", {
          cls: "cmd-btn" + (activeIssue ? " primary" : ""),
          text: activeIssue ? "Fix Now" : "Re-run",
          on: { click: function () {
            kitApi("/api/fix", { action: ra.id }, ra.cmd, ra.label);
          } }
        })
      ]));
    });

    // Blank checks.* helper (explicit user choice, never fabricated automatically)
    var blankStages = inst.blank_stages || [];
    var detectedCmds = inst.detected_commands || {};
    if (blankStages.length) {
      var blankBox = el("div", { style: "margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line);" }, [
        el("div", { style: "font-size: 12px; font-weight: 600; margin-bottom: 6px;", text: "Unconfigured Check Stages in charter.md (" + blankStages.length + " blank)" })
      ]);
      blankStages.forEach(function (st) {
        var suggested = detectedCmds[st];
        var btns = [];
        if (suggested) {
          btns.push(el("button", {
            cls: "cmd-btn primary",
            text: "Use `" + suggested + "`",
            on: { click: function () {
              var ch = {}; ch[st] = suggested;
              kitApi("/api/config", { checks: ch }, "python3 .ai-sdlc/bin/sdlc.py config --set-check " + st + "=\"" + suggested + "\"", "Set checks." + st);
            } }
          }));
        }
        btns.push(el("button", {
          cls: "cmd-btn",
          text: "Mark `absent`",
          on: { click: function () {
            var ch = {}; ch[st] = "absent";
            kitApi("/api/config", { checks: ch }, "python3 .ai-sdlc/bin/sdlc.py config --set-check " + st + "=absent", "Marked checks." + st + " absent");
          } }
        }));
        blankBox.appendChild(el("div", { style: "display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 12px;" }, [
          el("code", { text: "checks." + st }),
          el("div", { style: "display: flex; gap: 6px;" }, btns)
        ]));
      });
      repairCard.appendChild(blankBox);
    }
    grid.appendChild(repairCard);

    // Card 4: What's Installed (Kit Status Inventory)
    var harnesses = inst.harnesses || [];
    var hooks = inst.hooks || {};
    var guards = inst.guards || {};
    var skills = inst.skills || [];
    var activeRoles = (inst.roles || []).filter(function (r) { return r.active; });

    var invCard = el("div", { cls: "kit-card" }, [
      el("h2", null, [el("span", { text: "Installed Inventory (Kit Status)" }), el("span", { cls: "stamp", text: skills.length + " SKILLS · " + activeRoles.length + " ROLES" })])
    ]);

    var hSection = el("div", null, [
      el("div", { style: "font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;", text: "Agent Harnesses & Contract Pointers" })
    ]);
    var hWrap = el("div", { style: "display: flex; flex-wrap: wrap; gap: 6px;" });
    harnesses.forEach(function (hItem) {
      hWrap.appendChild(el("span", {
        cls: "stamp " + (hItem.wired ? "ok" : "bad"),
        text: hItem.file + (hItem.wired ? " · WIRED" : " · UNWIRED")
      }));
    });
    hSection.appendChild(hWrap);
    invCard.appendChild(hSection);

    var cSection = el("div", null, [
      el("div", { style: "font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;", text: "Detected CLI Tools on PATH" }),
      el("div", { style: "display: flex; flex-wrap: wrap; gap: 6px;" }, Object.keys(cliTools).map(function (k) {
        return el("span", {
          cls: "stamp " + (cliTools[k] ? "ok" : ""),
          text: k + (cliTools[k] ? " · ON PATH" : " · ABSENT")
        });
      }))
    ]);
    invCard.appendChild(cSection);

    var gSection = el("div", null, [
      el("div", { style: "font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;", text: "Enforcement Hooks & Guards" }),
      el("div", { style: "display: flex; flex-wrap: wrap; gap: 6px;" }, [
        el("span", { cls: "chip", text: "PreToolUse hooks: " + ((hooks.claude_hooks && hooks.claude_hooks.length) || 0) }),
        el("span", { cls: "chip", text: "Git pre-commit: " + (hooks.git_pre_commit ? "ON" : "off") }),
        el("span", { cls: "chip", text: "Git commit-msg: " + (hooks.git_commit_msg ? "ON" : "off") }),
        el("span", { cls: "chip", text: "Protected paths: " + ((guards.protected && guards.protected.length) || 0) }),
        el("span", { cls: "chip", text: "Locked tests: " + ((guards.test_locks && guards.test_locks.length) || 0) }),
        el("span", { cls: "chip", text: "Approval gates: " + ((guards.gates && guards.gates.length) || 0) })
      ])
    ]);
    invCard.appendChild(gSection);

    var rSection = el("div", null, [
      el("div", { style: "font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;", text: "Active Charter Roles (" + activeRoles.length + ")" }),
      el("div", { style: "display: flex; flex-wrap: wrap; gap: 4px;" }, activeRoles.map(function (r) {
        return el("span", { cls: "chip", text: r.name });
      }))
    ]);
    invCard.appendChild(rSection);
    grid.appendChild(invCard);
    main.appendChild(grid);

    if (!hasFailAlerts) {
      main.appendChild(renderDoctorFindingsSection());
    }
  }

  // ---------------------------------------------------------------- router
  function render() {
    var parts = location.hash.replace(/^#\/?/, "").split("/");
    var y = window.scrollY;
    main.textContent = "";
    var route = parts[0] || "threads";
    if (currentDocScrollSpy && route !== "doc") {
      window.removeEventListener("scroll", currentDocScrollSpy);
      currentDocScrollSpy = null;
    }
    if (route === "threads") viewThreads(decodeURIComponent(parts[1] || ""));
    else if (route === "kit") { location.replace("#/project/kit"); return; }
    else if (route === "project") viewProject(parts[1] || "");
    else if (route === "map") viewMap();
    else if (route === "cockpit") { location.replace("#/dashboard" + (parts[1] ? "/" + parts[1] : "")); return; }
    else if (route === "dashboard") viewDashboard(parts[1] || "");
    else if (route === "board") {
      var focusId = null, stageFilter = null;
      if (parts[1] === "focus") {
        focusId = decodeURIComponent(parts[2] || "");
      } else if (parts[1] === "stage") {
        stageFilter = decodeURIComponent(parts[2] || "");
        if (parts[3]) focusId = decodeURIComponent(parts[3] || "");
      } else if (parts[1] && ITEMS[decodeURIComponent(parts[1])]) {
        focusId = decodeURIComponent(parts[1]);
      }
      viewBoard(focusId, stageFilter);
    }
    else if (route === "activity") { THREAD_STATE.mode = "feed"; location.replace("#/threads"); return; }
    else if (route === "waiting" || route === "blockages") viewWaiting();
    else if (route === "git") viewGit();
    else if (route === "docs") viewDocs();
    else if (route === "item") viewItem(decodeURIComponent(parts[1] || ""));
    else if (route === "doc") viewDoc(decodeURIComponent(parts[1] || ""), parts[2] !== undefined ? +parts[2] : undefined);
    else if (route === "search") viewSearch(decodeURIComponent(parts.slice(1).join("/")));
    else viewThreads("");
    if (render.same) window.scrollTo(0, y);
    markSelected();
    render.same = false;
  }
  var lastHash = location.hash;
  renderPanel({ quiet: true });
  trackNav();
  window.addEventListener("hashchange", function () {
    trackNav();
    if (location.hash.indexOf("#/item/") !== 0 || lastHash.split("/")[2] !== location.hash.split("/")[2]) ITEM_TAB = "overview";
    lastHash = location.hash;
    window.scrollTo(0, 0);
    render();
  });
  var inner = render;
  render = function () { render.same = true; inner(); };
  inner();

  // ---------------------------------------------------------------- live mode
  // Poll a cheap fingerprint; fetch the model only when it moved. A redraw keeps the
  // route, folds, filters, open panels and scroll, and waits while you are typing.
  if (LIVE) {
    var pending = null;
    function busy() {
      var a = document.activeElement;
      return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.id !== "q";
    }
    function apply(model) {
      if (busy()) { pending = model; return; }
      pending = null;
      var open = [].map.call(document.querySelectorAll("details[open] > summary"), function (x) {
        return x.textContent.replace(/[0-9]+/g, "#");
      });
      var prevModel = M;
      load(model);
      diffModels(prevModel, model);
      liveAt = new Date();
      paintMeta();
      render();
      [].forEach.call(document.querySelectorAll("details > summary"), function (x) {
        if (open.indexOf(x.textContent.replace(/[0-9]+/g, "#")) >= 0) x.parentNode.open = true;
      });
      // A docked inspector follows the new model without taking focus.
      if (isDocked() && PANEL.tab === "item" && INSPECT && INSPECT.kind === "item" && !(drawerEl.contains(document.activeElement))) reopenInspect(INSPECT, true);
      else refreshPanelChrome();
    }
    document.addEventListener("focusout", function () { if (pending) setTimeout(function () { if (pending) apply(pending); }, 0); });
    function poll() {
      fetch("version", { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      }).then(function (v) {
        var was = liveState;
        liveState = "live";
        if (v && v !== M.version) {
          return fetch("model.json", { cache: "no-store" }).then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          }).then(apply);
        }
        if (was !== "live") paintMeta();
        else paintActivityBar();
      }).catch(function () {
        if (liveState !== "down") { liveState = "down"; paintMeta(); }
      }).then(function () {
        setTimeout(poll, (M.live_interval || 2) * 1000);
      });
    }
    setTimeout(poll, (M.live_interval || 2) * 1000);
  }
  // Warm the Project lens in the background, so its failures reach Needs you and Issues.
  if (LIVE) setTimeout(function () { loadLens(false); }, 400);
})();
</script>
</body>
</html>
