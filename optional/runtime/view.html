<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuhut view</title>
<!--
  Generated by `python3 .ai-sdlc/bin/sdlc.py view` from the project's records at the time
  it ran. Read-only, git-ignored, offline. Re-run the command to refresh it.
  Every piece of record text is inserted with textContent, never as HTML.
-->
<style>
  :root {
    --bg: #ffffff; --panel: #f6f8fa; --line: #d0d7de; --text: #1f2328; --muted: #57606a;
    --link: #0969da; --accent: #2f8f5b; --warn: #9a6700; --warnbg: #fff8e6; --bad: #cf222e;
    --badbg: #ffebe9; --okbg: #dafbe1; --chip: #eaeef2; --pea: #e9c98e;
    --c-Now: #0969da; --c-Next: #8250df; --c-Blocked: #cf222e; --c-Parked: #bf8700;
    --c-Later: #6e7781; --c-Done: #2f8f5b; --c-Dropped: #afb8c1; --c-Other: #6e7781;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #9da7b3;
      --link: #4493f8; --accent: #3fb950; --warn: #e3b341; --warnbg: #2a2111; --bad: #f85149;
      --badbg: #3c1618; --okbg: #12261a; --chip: #21262d;
      --c-Now: #4493f8; --c-Next: #a371f7; --c-Blocked: #f85149; --c-Parked: #d29922;
      --c-Later: #8b949e; --c-Done: #3fb950; --c-Dropped: #484f58; --c-Other: #8b949e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  a { color: var(--link); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px;
    align-items: center; padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 16px; height: 16px; border-radius: 50%; background: var(--pea);
    display: inline-block; border: 2px solid #b8843e; }
  nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.tabs a { padding: 4px 10px; border-radius: 6px; color: var(--text); }
  nav.tabs a.on { background: var(--bg); border: 1px solid var(--line); }
  #q { flex: 1 1 180px; max-width: 320px; padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .meta { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.live { background: var(--accent); box-shadow: 0 0 0 3px var(--okbg); }
  .dot.down { background: var(--bad); }
  #crumbs { padding: 8px 16px 0; color: var(--muted); font-size: 13px; }
  #crumbs span.sep { margin: 0 6px; }
  main { padding: 8px 16px 48px; }
  h1 { font-size: 20px; margin: 8px 0 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 24px 0 8px; }
  .chip { display: inline-block; padding: 0 8px; border-radius: 10px; background: var(--chip);
    font-size: 12px; margin-right: 4px; white-space: nowrap; }
  .chip.col { color: #fff; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; background: var(--panel); }
  .stat b { font-size: 18px; margin-right: 6px; }
  .banner { border: 1px solid var(--warn); background: var(--warnbg); border-radius: 8px;
    padding: 8px 12px; margin: 8px 0; }
  .banner.bad { border-color: var(--bad); background: var(--badbg); }
  .muted { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; margin: 6px 0 12px; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: var(--panel); }
  .wrap { overflow-x: auto; }
  /* mind map */
  .mapbar { display: flex; gap: 8px; margin: 4px 0 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; }
  .map { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .map svg text { font-size: 13px; fill: var(--text); cursor: pointer; }
  .map svg text.nav { fill: var(--link); }
  .map svg text.count { fill: var(--muted); font-size: 11px; }
  .map svg path { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .map svg circle { stroke-width: 2; cursor: pointer; }
  /* board */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; align-items: center; }
  select, .filters input { font: inherit; padding: 3px 6px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .board { display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; padding-bottom: 8px; }
  .colm { flex: 0 0 250px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px; }
  .colm h3 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between;
    border-top: 3px solid var(--c-Other); padding-top: 6px; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; margin-bottom: 6px; }
  .card .t { margin: 2px 0 4px; }
  .card.blocked { border-left: 3px solid var(--bad); }
  /* activity, queue */
  .entry { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .entry .hd { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .entry pre, .doc pre { white-space: pre-wrap; background: var(--panel); padding: 8px;
    border-radius: 6px; overflow-x: auto; font-size: 12px; }
  /* stepper */
  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 12px; }
  .step { padding: 4px 10px; border-radius: 14px; font-size: 12px; border: 1px solid var(--line); }
  .step.done { background: var(--okbg); border-color: var(--accent); }
  .step.missing { background: var(--warnbg); border-color: var(--warn); }
  .step.na { color: var(--muted); }
  .tabsbar { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-top: 12px; }
  .tabsbar a { padding: 6px 12px; color: var(--text); border: 1px solid transparent; border-bottom: none;
    border-radius: 6px 6px 0 0; }
  .tabsbar a.on { border-color: var(--line); background: var(--panel); }
  /* documents */
  .docgrid { display: grid; grid-template-columns: 240px 1fr; gap: 16px; }
  .outline { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px);
    overflow: auto; font-size: 13px; border-right: 1px solid var(--line); padding-right: 8px; }
  .outline a { display: block; color: var(--text); padding: 1px 0; }
  .doc { min-width: 0; }
  .doc h1, .doc h2, .doc h3, .doc h4 { text-transform: none; letter-spacing: 0; color: var(--text); }
  .doc h2 { font-size: 17px; } .doc h3 { font-size: 15px; } .doc h4 { font-size: 14px; }
  .doc code, .entry code { background: var(--chip); padding: 0 4px; border-radius: 4px; font-size: 12px; }
  .doc blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .flash { outline: 2px solid var(--accent); }
  @media (max-width: 720px) {
    .docgrid { grid-template-columns: 1fr; }
    .outline { position: static; max-height: none; border-right: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i><span id="pname">Nuhut</span></div>
  <nav class="tabs" id="tabs">
    <a data-r="map">Map</a><a data-r="board">Board</a><a data-r="activity">Activity</a>
    <a data-r="waiting">Waiting on you</a><a data-r="git">Git</a><a data-r="docs">Documents</a>
  </nav>
  <input id="q" type="search" placeholder="Search IDs, titles, documents…" aria-label="Search">
  <div class="meta" id="meta"></div>
</header>
<div id="crumbs"></div>
<main id="main"></main>
<script>var M = /*NUHUT_MODEL*/null;</script>
<script>
(function () {
  "use strict";
  var main = document.getElementById("main");
  if (!M) {
    main.textContent = "No model in this page. Generate it with: python3 .ai-sdlc/bin/sdlc.py view";
    return;
  }
  var ITEMS, DOCS, WL, ID_RE, DOC_BY_PATH;
  // Everything derived from the model, so live mode can swap in a new one.
  function load(model) {
    M = model;
    ITEMS = M.items; DOCS = M.docs; WL = M.worklog;
    ID_RE = M.id_pattern ? new RegExp(M.id_pattern, "g") :
            (M.prefix ? new RegExp("\\b" + M.prefix.replace(/[.*+?^$()|[\]\\]/g, "\\$&") + "-[0-9]+\\b", "g") : null);
    DOC_BY_PATH = {};
    DOCS.forEach(function (d, n) { DOC_BY_PATH[d.path] = n; });
  }
  load(M);

  // ---------------------------------------------------------------- helpers
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "cls") n.className = attrs[k];
      else if (k === "on") Object.keys(attrs.on).forEach(function (e) { n.addEventListener(e, attrs.on[e]); });
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }
  function go(route) { location.hash = "#/" + route; }
  function link(text, route, cls) {
    return el("a", { href: "#/" + route, text: text, cls: cls || "" });
  }
  function itemLink(id) {
    var it = ITEMS[id];
    var a = link(id, "item/" + id);
    if (it && it.title) a.title = it.title;
    return a;
  }
  function docRoute(n, line) {
    return "doc/" + encodeURIComponent(DOCS[n].path) + (line !== undefined ? "/" + line : "");
  }
  function colChip(col) {
    var c = el("span", { cls: "chip col", text: col || "?" });
    c.style.background = "var(--c-" + (col || "Other") + ")";
    return c;
  }
  function daysSince(s) {
    var m = /(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
    if (!m) return null;
    return Math.floor((Date.now() - new Date(+m[1], m[2] - 1, +m[3]).getTime()) / 86400000);
  }
  function clip(s, n) { s = s || ""; return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function h(level, text) { return el("h" + level, { text: text }); }

  // Inline markdown: code, bold, links, and work item IDs. Text nodes only.
  function inline(text, baseDir) {
    var frag = document.createDocumentFragment();
    var parts = [/`([^`]+)`/, /\*\*([^*]+)\*\*/, /\[([^\]]+)\]\(([^)\s]+)\)/];
    var re = new RegExp(parts.map(function (p) { return p.source; }).join("|") +
      (ID_RE ? "|(" + ID_RE.source + ")" : ""), "g");
    var last = 0, m;
    text = text || "";
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1] !== undefined) frag.appendChild(el("code", { text: m[1] }));
      else if (m[2] !== undefined) frag.appendChild(el("strong", null, [inline(m[2], baseDir)]));
      else if (m[3] !== undefined) frag.appendChild(mdLink(m[3], m[4], baseDir));
      else if (m[5] !== undefined) frag.appendChild(itemLink(m[5]));
      last = re.lastIndex;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }
  function mdLink(label, href, baseDir) {
    if (/^https?:\/\//.test(href)) {
      return el("a", { href: href, text: label, target: "_blank", rel: "noopener noreferrer" });
    }
    var path = href.split("#")[0];
    if (path && /\.md$/.test(path) && baseDir !== undefined) {
      var parts = (baseDir ? baseDir.split("/") : []).concat(path.split("/")), out = [];
      parts.forEach(function (p) {
        if (p === "..") out.pop(); else if (p && p !== ".") out.push(p);
      });
      var n = DOC_BY_PATH[out.join("/")];
      if (n !== undefined) return link(label, docRoute(n));
    }
    return el("span", { text: label, title: href });
  }

  // Block markdown, enough for the kit's records: headings, tables, lists, quotes, fences.
  function renderMd(text, baseDir) {
    var box = el("div", { cls: "doc" }), lines = (text || "").split("\n"), i = 0, para = [];
    function flush() {
      if (para.length) box.appendChild(el("p", null, [inline(para.join(" "), baseDir)]));
      para = [];
    }
    if (lines[0] === "---") {
      var end = lines.indexOf("---", 1);
      if (end > 0) {
        var t = el("table");
        lines.slice(1, end).forEach(function (l) {
          var k = l.split(":");
          t.appendChild(el("tr", null, [el("th", { text: k[0] }), el("td", { text: k.slice(1).join(":").trim() })]));
        });
        box.appendChild(t);
        i = end + 1;
      }
    }
    while (i < lines.length) {
      var line = lines[i], m;
      if (/^```/.test(line)) {
        flush();
        var buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        box.appendChild(el("pre", { text: buf.join("\n") }));
        i++;
        continue;
      }
      if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) {
        flush();
        var hd = el("h" + m[1].length, { id: "L" + i }, [inline(m[2], baseDir)]);
        box.appendChild(hd);
        i++;
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line)) {
        flush();
        var wrap = el("div", { cls: "wrap" }), table = el("table"), first = true;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          var cells = lines[i].trim().slice(1, -1).split(/(?<!\\)\|/);
          if (!cells.every(function (c) { return /^\s*:?-+:?\s*$/.test(c); })) {
            var tr = el("tr");
            cells.forEach(function (c) {
              tr.appendChild(el(first ? "th" : "td", null, [inline(c.trim().replace(/\\\|/g, "|"), baseDir)]));
            });
            table.appendChild(tr);
            first = false;
          }
          i++;
        }
        wrap.appendChild(table);
        box.appendChild(wrap);
        continue;
      }
      if ((m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line))) {
        flush();
        var ul = el("ul");
        while (i < lines.length && (m = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(lines[i]))) {
          var li = el("li", null, [inline(m[3], baseDir)]);
          li.style.marginLeft = Math.min(m[1].length, 8) * 8 + "px";
          ul.appendChild(li);
          i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^(\s*)([-*]|\d+\.)\s+/.test(lines[i])) {
            li.appendChild(document.createTextNode(" "));
            li.appendChild(inline(lines[i].trim(), baseDir));
            i++;
          }
        }
        box.appendChild(ul);
        continue;
      }
      if (/^>/.test(line)) {
        flush();
        var q = [];
        while (i < lines.length && /^>/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
        box.appendChild(el("blockquote", null, [inline(q.join(" "), baseDir)]));
        continue;
      }
      if (/^\s*$/.test(line) || /^---+\s*$/.test(line)) { flush(); i++; continue; }
      para.push(line.trim());
      i++;
    }
    flush();
    return box;
  }

  // ---------------------------------------------------------------- chrome
  var LIVE = /^https?:$/.test(location.protocol) && !!M.version, liveState = "live", liveAt = new Date();
  function paintMeta() {
    document.getElementById("pname").textContent = M.project || "Nuhut";
    document.title = (M.project || "Project") + " — Nuhut view";
    var meta = document.getElementById("meta");
    meta.textContent = "";
    var gitRef = M.git_head ? (M.git_branch ? M.git_branch + "@" : "") + M.git_head : "";
    if (!LIVE) {
      meta.textContent = "generated " + M.generated + (gitRef ? " at " + gitRef : "") +
        " · re-run sdlc.py view to refresh";
    } else {
      var dot = el("span", { cls: "dot " + liveState });
      var when = liveAt.toTimeString().slice(0, 8);
      meta.appendChild(dot);
      meta.appendChild(document.createTextNode(liveState === "live"
        ? "Live · updated " + when + (gitRef ? " at " + gitRef : "")
        : "Disconnected · showing data from " + when + " · restart sdlc.py view --serve"));
    }
    meta.appendChild(el("button", {
      text: "Export HTML",
      title: "Download self-contained offline dashboard HTML",
      style: "margin-left: 8px; padding: 2px 8px; font-size: 11px;",
      on: { click: exportHtml }
    }));
  }
  paintMeta();
  var q = document.getElementById("q"), qTimer;
  q.addEventListener("input", function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { if (q.value.trim()) go("search/" + encodeURIComponent(q.value.trim())); }, 200);
  });
  document.getElementById("tabs").addEventListener("click", function (e) {
    if (e.target.dataset.r) go(e.target.dataset.r);
  });
  function crumbs(list) {
    var c = document.getElementById("crumbs");
    c.textContent = "";
    list.forEach(function (x, n) {
      if (n) c.appendChild(el("span", { cls: "sep", text: "›" }));
      c.appendChild(x[1] ? link(x[0], x[1]) : el("span", { text: x[0] }));
    });
  }
  function tab(name) {
    [].forEach.call(document.querySelectorAll("#tabs a"), function (a) {
      a.className = a.dataset.r === name ? "on" : "";
    });
  }

  // ---------------------------------------------------------------- map
  var OPEN = {};
  function mapTree() {
    var ids = M.order;
    function itemNode(id) {
      var it = ITEMS[id];
      return { key: "i:" + id, label: id + "  " + clip(it.title, 42), full: id + " " + (it.title || ""),
        route: "item/" + id, col: it.column };
    }
    var byCol = M.columns.map(function (c) {
      var kids = ids.filter(function (id) { return ITEMS[id].column === c; }).map(itemNode);
      return kids.length ? { key: "c:" + c, label: c, col: c, children: kids } : null;
    }).filter(Boolean);
    var owners = {};
    ids.forEach(function (id) {
      var o = ITEMS[id].owner;
      if (o && ["Done", "Dropped"].indexOf(ITEMS[id].column) < 0) (owners[o] = owners[o] || []).push(id);
    });
    var byOwner = Object.keys(owners).sort().map(function (o) {
      return { key: "o:" + o, label: o, children: owners[o].map(itemNode) };
    });
    var kinds = {};
    DOCS.forEach(function (d, n) {
      if (d.kind === "index") return;
      (kinds[d.kind] = kinds[d.kind] || []).push(n);
    });
    var kindNames = { record: "Records", plans: "Plans", reviews: "Reviews", defects: "Defects",
      postmortems: "Postmortems", adr: "ADRs", archive: "Worklog archive" };
    var byDoc = Object.keys(kinds).map(function (k) {
      return { key: "k:" + k, label: kindNames[k] || k, children: kinds[k].map(function (n) {
        var d = DOCS[n];
        return { key: "d:" + d.path, label: clip(d.path.split("/").pop(), 40), full: d.path,
          route: docRoute(n), children: d.headings.filter(function (x) { return x.level === 2; })
            .map(function (x) { return { key: "h:" + d.path + x.line, label: clip(x.text, 40), full: x.text,
              route: docRoute(n, x.line) }; }) };
      }) };
    });
    var root = { key: "root", label: M.project || "Project", children: [
      { key: "g:status", label: "Work by status", children: byCol },
      { key: "g:owner", label: "Open work by owner role", children: byOwner },
      { key: "g:docs", label: "Documents", children: byDoc }
    ] };
    if (M.epics.length) {
      root.children.splice(1, 0, { key: "g:epics", label: "Epics", children: M.epics.map(function (e) {
        return { key: "e:" + e.name, label: e.name, children: e.items.filter(function (id) { return ITEMS[id]; }).map(itemNode) };
      }) });
    }
    return root;
  }
  function isOpen(n, depth) { return OPEN[n.key] !== undefined ? OPEN[n.key] : depth < 2; }

  function escXml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&apos;");
  }

  function downloadFile(filename, content, mime) {
    var blob = new Blob([content], { type: mime || "application/octet-stream" });
    var a = el("a", { href: URL.createObjectURL(blob), download: filename });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 100);
  }

  function exportHtml() {
    var title = (M.project || "nuhut").toLowerCase().replace(/[^a-z0-9]+/g, "-");
    var doc = "<!doctype html>\n" + document.documentElement.outerHTML;
    downloadFile(title + "-dashboard.html", doc, "text/html;charset=utf-8");
  }

  function buildSvgExport(opts) {
    opts = opts || {};
    var isInteractive = !!opts.interactive;
    var root = mapTree(), ROW = 24, COLW = 230, rows = 0, maxDepth = 0, nodes = [], links = [];
    (function place(n, depth) {
      n.depth = depth;
      maxDepth = Math.max(maxDepth, depth);
      var kids = n.children || [];
      if (kids.length && (opts.allOpen || isOpen(n, depth))) {
        kids.forEach(function (k) { place(k, depth + 1); links.push([n, k]); });

  // ---------------------------------------------------------------- live mode
  // Poll a cheap fingerprint; fetch the model only when it moved. A redraw keeps the
  // route, folds, filters, open panels and scroll, and waits while you are typing.
  if (LIVE) {
    var pending = null;
    function busy() {
      var a = document.activeElement;
      return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.id !== "q";
    }
    function apply(model) {
      if (busy()) { pending = model; return; }
      pending = null;
      var open = [].map.call(document.querySelectorAll("details[open] > summary"), function (x) {
        return x.textContent.replace(/[0-9]+/g, "#");
      });
      load(model);
      liveAt = new Date();
      paintMeta();
      render();
      [].forEach.call(document.querySelectorAll("details > summary"), function (x) {
        if (open.indexOf(x.textContent.replace(/[0-9]+/g, "#")) >= 0) x.parentNode.open = true;
      });
    }
    document.addEventListener("focusout", function () { if (pending) setTimeout(function () { if (pending) apply(pending); }, 0); });
    function poll() {
      fetch("version", { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      }).then(function (v) {
        var was = liveState;
        liveState = "live";
        if (v && v !== M.version) {
          return fetch("model.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(apply);
        }
        if (was !== "live") paintMeta();
